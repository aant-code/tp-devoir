name: tp-devoir prod
run-name: tp-devoir
on:
  push:
    branches:
      - main
jobs:
  Deploy_project:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🐧 Let's cook mister"
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api /api
      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/front /front
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:latest
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/front:latest
      - run: curl ${{ secrets.DEPLOY_HOOK }}